<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Weather App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-8">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_KEY = "02c9a93ded708cfeae5495787b2032c7"; 
        
        const lat = 51.5074;
        const lon = -0.1278;

        function WeatherDashboard() {
            const [weather, setWeather] = useState(null);
            const mapRef = useRef(null);
            const mapInstance = useRef(null);

            useEffect(() => {
                fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`)
                    .then(response => response.json())
                    .then(data => setWeather(data))
                    .catch(error => console.log("Error fetching weather:", error));
            }, []);

            useEffect(() => {
                if (mapRef.current && !mapInstance.current) {
                    mapInstance.current = L.map(mapRef.current).setView([lat, lon], 7);
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap'
                    }).addTo(mapInstance.current);

                    if (API_KEY !== "YOUR_KEY_HERE") {
                        L.tileLayer(`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
                            opacity: 0.6,
                            attribution: '© OpenWeatherMap'
                        }).addTo(mapInstance.current);
                    }
                }
            }, []);

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <h1 className="text-4xl font-bold text-blue-400">SkyCast</h1>
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <div className="col-span-1 bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
                            <h2 className="text-xl font-semibold mb-4">Current Weather</h2>
                            {weather ? (
                                <div>
                                    <p className="text-5xl font-light mb-2">{Math.round(weather.main.temp)}°C</p>
                                    <p className="text-slate-400 capitalize mb-6">{weather.weather[0].description}</p>
                                    
                                    <div className="space-y-3 text-sm">
                                        <div className="flex justify-between bg-slate-900 p-3 rounded-lg">
                                            <span className="text-slate-400">Humidity</span>
                                            <span>{weather.main.humidity}%</span>
                                        </div>
                                        <div className="flex justify-between bg-slate-900 p-3 rounded-lg">
                                            <span className="text-slate-400">Wind</span>
                                            <span>{weather.wind.speed} m/s</span>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <p className="text-slate-400">Loading weather...</p>
                            )}
                        </div>

                        <div className="col-span-1 md:col-span-2 bg-slate-800 p-2 rounded-2xl shadow-lg border border-slate-700">
                            <div ref={mapRef} className="w-full h-80 rounded-xl"></div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WeatherDashboard />);
    </script>
</body>
</html>
