<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleek Weather App</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen p-8">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const API_KEY = "02c9a93ded708cfeae5495787b2032c7"; 
        
        function WeatherDashboard() {
            const [weather, setWeather] = useState(null);
            const [searchInput, setSearchInput] = useState(""); 
            const [coords, setCoords] = useState(null); // Set to null initially
            const [locationError, setLocationError] = useState("");
            
            const mapRef = useRef(null);
            const mapInstance = useRef(null);

            // 1. Get User Location on Load
            useEffect(() => {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            setCoords({
                                lat: position.coords.latitude,
                                lon: position.coords.longitude
                            });
                        },
                        (error) => {
                            console.log("Geolocation error:", error);
                            // Fallback to London if they deny access
                            setCoords({ lat: 51.5074, lon: -0.1278 });
                            setLocationError("Location access denied. Defaulting to London.");
                        }
                    );
                } else {
                    // Fallback if browser doesn't support geolocation
                    setCoords({ lat: 51.5074, lon: -0.1278 });
                }
            }, []);

            // 2. Fetch Weather when Coordinates Change
            useEffect(() => {
                if (!coords) return; // Don't fetch until we have coordinates

                fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${coords.lat}&lon=${coords.lon}&appid=${API_KEY}&units=metric`)
                    .then(response => {
                        if (!response.ok) throw new Error("Location not found");
                        return response.json();
                    })
                    .then(data => {
                        setWeather(data);
                    })
                    .catch(error => {
                        console.log("Error fetching weather:", error);
                    });
            }, [coords]);

            // 3. Initialize Map once we have coordinates
            useEffect(() => {
                if (!coords || mapInstance.current) return;

                if (mapRef.current) {
                    mapInstance.current = L.map(mapRef.current).setView([coords.lat, coords.lon], 10);
                    
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                        attribution: '© OpenStreetMap'
                    }).addTo(mapInstance.current);

                    if (API_KEY !== "YOUR_KEY_HERE") {
                        L.tileLayer(`https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=${API_KEY}`, {
                            opacity: 0.6,
                            attribution: '© OpenWeatherMap'
                        }).addTo(mapInstance.current);
                    }
                }
            }, [coords]);

            // 4. Update Map view if coordinates change later
            useEffect(() => {
                if (mapInstance.current && coords) {
                    mapInstance.current.setView([coords.lat, coords.lon], 10);
                }
            }, [coords]);

            // 5. Handle Search Bar (Fetch by City Name)
            const handleSearch = (e) => {
                e.preventDefault();
                if (searchInput.trim() !== "") {
                    setLocationError(""); // clear any old errors
                    fetch(`https://api.openweathermap.org/data/2.5/weather?q=${searchInput}&appid=${API_KEY}&units=metric`)
                        .then(response => {
                            if (!response.ok) throw new Error("City not found");
                            return response.json();
                        })
                        .then(data => {
                            setWeather(data);
                            setCoords({ lat: data.coord.lat, lon: data.coord.lon });
                            setSearchInput(""); 
                        })
                        .catch(error => {
                            console.log("Error fetching weather:", error);
                            alert("City not found! Please check the spelling and try again.");
                        });
                }
            };

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    
                    <div className="flex flex-col md:flex-row justify-between items-center gap-4">
                        <h1 className="text-4xl font-bold text-blue-400">SkyCast</h1>
                        
                        <form onSubmit={handleSearch} className="flex w-full md:w-auto space-x-2">
                            <input 
                                type="text" 
                                value={searchInput}
                                onChange={(e) => setSearchInput(e.target.value)}
                                placeholder="Enter city name..." 
                                className="flex-1 px-4 py-2 rounded-lg bg-slate-800 border border-slate-700 focus:outline-none focus:border-blue-500 text-white"
                            />
                            <button type="submit" className="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg font-semibold transition">
                                Search
                            </button>
                        </form>
                    </div>

                    {locationError && (
                        <div className="bg-yellow-500/10 border border-yellow-500/50 text-yellow-400 px-4 py-2 rounded-lg text-sm">
                            {locationError}
                        </div>
                    )}
                    
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        
                        <div className="col-span-1 bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
                            <h2 className="text-xl font-semibold mb-4 text-blue-300">
                                {weather ? weather.name : "Locating..."}
                            </h2>
                            
                            {weather ? (
                                <div>
                                    <p className="text-5xl font-light mb-2">{Math.round(weather.main.temp)}°C</p>
                                    <p className="text-slate-400 capitalize mb-6">{weather.weather[0].description}</p>
                                    
                                    <div className="space-y-3 text-sm">
                                        <div className="flex justify-between bg-slate-900 p-3 rounded-lg">
                                            <span className="text-slate-400">Humidity</span>
                                            <span>{weather.main.humidity}%</span>
                                        </div>
                                        <div className="flex justify-between bg-slate-900 p-3 rounded-lg">
                                            <span className="text-slate-400">Wind</span>
                                            <span>{weather.wind.speed} m/s</span>
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <p className="text-slate-400">Waiting for location access...</p>
                            )}
                        </div>

                        <div className="col-span-1 md:col-span-2 bg-slate-800 p-2 rounded-2xl shadow-lg border border-slate-700 relative z-0">
                            <div ref={mapRef} className="w-full h-80 rounded-xl"></div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WeatherDashboard />);
    </script>
</body>
</html>
